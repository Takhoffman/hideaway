name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release credentials
        run: test -n "$SPARKLE_PRIVATE_KEY"

      - name: Build app
        env:
          VERSION: ${{ github.ref_name }}
        run: Scripts/build-app.sh "${VERSION#v}" "$GITHUB_RUN_NUMBER"

      - name: Package app and generate signed appcast
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          RELEASE_DIR="$RUNNER_TEMP/hideaway-release"
          mkdir -p "$RELEASE_DIR"
          ditto -c -k --sequesterRsrc --keepParent dist/Hideaway.app "$RELEASE_DIR/Hideaway-$VERSION.zip"
          cp updates/appcast.xml "$RELEASE_DIR/appcast.xml"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/Takhoffman/hideaway/releases/download/$TAG/" \
            --link "https://github.com/Takhoffman/hideaway" \
            --maximum-versions 5 \
            -o "$RELEASE_DIR/appcast.xml" \
            "$RELEASE_DIR"
          cp "$RELEASE_DIR/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          gh release create "$TAG" "$RUNNER_TEMP/hideaway-release/Hideaway-$VERSION.zip" \
            --title "Hideaway $VERSION" \
            --generate-notes \
            --verify-tag

      - name: Publish appcast
        run: |
          set -euo pipefail
          git fetch origin main
          git switch main
          cp "$RUNNER_TEMP/appcast.xml" updates/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update appcast for $GITHUB_REF_NAME"
            git push origin main
          fi
